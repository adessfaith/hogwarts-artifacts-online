spring:
  cloud:
    azure:
      keyvault:
        secret:
          property-sources[0]:
            endpoint: ${AZURE_KEY_VAULT_ENDPOINT} # environment variable
  datasource:
    url: ${datasource-url} # secret
    username: ${datasource-username} # secret
    password: ${datasource-password} # secret
  jpa:
    hibernate:
      ddl-auto: none # Turn off the DDL auto generation.
